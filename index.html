<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>STARDUST GARDEN</title>
<style>
body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0b1026;color:#fff;font-family:sans-serif;text-align:center}
button{font-size:1.2rem;padding:12px 24px;border-radius:8px;border:none;margin-top:16px}
</style>
</head>
<body>
<h1>STARDUST GARDEN</h1>
<p>表示テスト</p>
<button id="btn">星をひろう：0</button>
<script>
let n=0;
document.getElementById("btn").addEventListener("click",()=>{
  n++;
  document.getElementById("btn").textContent="星をひろう："+n;
});
</script>
</body>
</html>
